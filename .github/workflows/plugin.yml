name: Build BetterNCM plugin

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install private x86 runtime for packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile build/dotnet-install.ps1
          ./build/dotnet-install.ps1 -Channel 9.0 -Runtime dotnet -Architecture x86 -InstallDir build/dotnet-x86 -NoPath
          if (-not (Test-Path build/dotnet-x86/host/fxr)) { throw 'x86 runtime installation failed' }
      - name: Build in-process plugin and bundled runtime
        shell: pwsh
        run: ./scripts/build-plugin.ps1 -Compiler cl -RuntimeRootX86 (Join-Path $PWD 'build/dotnet-x86')
      - name: Verify native ABI, process exit and settings
        shell: pwsh
        run: |
          ./scripts/build-native-hosts.ps1
          python tests/native-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Native smoke checks failed' }
          node tests/ui-flow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Settings UI checks failed' }
      - name: Verify credentials across process restart
        shell: pwsh
        run: |
          dotnet build tests/session/SessionChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Session checks build failed' }
          $env:YYSYNC_CONFIG_DIRECTORY = Join-Path $PWD 'build/session-fixture'
          dotnet tests/session/bin/Release/net9.0/SessionChecks.dll write
          if ($LASTEXITCODE -ne 0) { throw 'Credential save check failed' }
          dotnet tests/session/bin/Release/net9.0/SessionChecks.dll verify
          if ($LASTEXITCODE -ne 0) { throw 'Credential reload check failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: yySyncNCM-0.2.1-plugin
          path: build/yySyncNCM.plugin
          if-no-files-found: error
